<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1a0b2e">
<link rel="manifest" href="/manifest.json">
<title>KizConnect</title>
<style>
:root{
  --violet:#2a1052;--violet2:#3d1a6e;--deep:#160a2b;
  --gold:#e8c26a;--gold2:#c99b3f;--paper:#f4ecdd;
  --ink:#f4ecdd;--muted:#b9a9d6;--card:rgba(255,255,255,.06);
  --line:rgba(232,194,106,.25);--danger:#e8746a;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:radial-gradient(120% 100% at 50% 0%,#3d1a6e 0%,#2a1052 40%,#160a2b 100%);
  color:var(--ink);min-height:100vh;padding-bottom:76px;
}
.hidden{display:none!important}
header{
  padding:18px 18px 12px;position:sticky;top:0;z-index:20;
  background:linear-gradient(180deg,rgba(22,10,43,.95),rgba(22,10,43,.7));
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-size:20px;letter-spacing:.5px;font-weight:700}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px var(--gold)}
.brand small{color:var(--muted);font-size:11px;display:block;letter-spacing:1px;text-transform:uppercase}
main{padding:16px 16px 20px;max-width:620px;margin:0 auto}
h2{font-size:17px;margin-bottom:4px;color:var(--gold)}
.sub{color:var(--muted);font-size:13px;margin-bottom:14px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:14px 15px;margin-bottom:12px;position:relative;
}
.card h3{font-size:15px;margin-bottom:4px}
.card .meta{color:var(--muted);font-size:12.5px;line-height:1.5}
.tag{display:inline-block;background:rgba(232,194,106,.14);color:var(--gold);
  border:1px solid var(--line);padding:2px 9px;border-radius:20px;font-size:11px;margin:6px 6px 0 0}
.price{color:var(--gold);font-weight:700;font-size:16px}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
button,.btn{
  font-family:inherit;cursor:pointer;border:none;border-radius:12px;font-size:14px;font-weight:600;
}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#2a1052;padding:11px 16px;width:100%}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--gold);padding:8px 14px}
.btn-sm{padding:7px 13px;font-size:12.5px}
.fab{
  position:fixed;right:18px;bottom:88px;width:56px;height:56px;border-radius:50%;
  background:linear-gradient(135deg,var(--gold),var(--gold2));color:#2a1052;font-size:28px;
  box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:30;display:flex;align-items:center;justify-content:center;
}
nav{
  position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;
  background:linear-gradient(180deg,rgba(22,10,43,.85),rgba(22,10,43,.98));
  backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 4px 12px;
}
nav button{
  flex:1;background:none;color:var(--muted);display:flex;flex-direction:column;
  align-items:center;gap:3px;font-size:10.5px;padding:4px 0;
}
nav button.active{color:var(--gold)}
nav button .ic{font-size:20px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px}
input,select,textarea{
  width:100%;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:11px;
  color:var(--ink);padding:12px;font-size:15px;font-family:inherit;
}
textarea{resize:vertical;min-height:70px}
.overlay{position:fixed;inset:0;background:rgba(11,5,22,.7);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{
  background:linear-gradient(180deg,#3d1a6e,#2a1052);width:100%;max-width:620px;
  border-radius:22px 22px 0 0;padding:20px 18px 26px;border-top:1px solid var(--line);
  max-height:88vh;overflow-y:auto;
}
.sheet h2{margin-bottom:14px}
.empty{text-align:center;color:var(--muted);padding:40px 10px;font-size:14px}
.empty .big{font-size:40px;margin-bottom:10px;opacity:.6}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:1px solid var(--line);background:transparent;color:var(--muted);padding:7px 14px;border-radius:20px;font-size:13px}
.chip.on{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#2a1052;border-color:transparent}
.thread{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid rgba(255,255,255,.06)}
.av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--violet2),var(--gold2));
  display:flex;align-items:center;justify-content:center;font-weight:700;color:#160a2b;flex-shrink:0}
.chat{display:flex;flex-direction:column;gap:8px;padding:8px 0 12px}
.bub{max-width:78%;padding:9px 13px;border-radius:14px;font-size:14px;line-height:1.4}
.bub.me{align-self:flex-end;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#2a1052;border-bottom-right-radius:4px}
.bub.them{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.chatbar{display:flex;gap:8px;position:sticky;bottom:0;padding-top:8px;background:linear-gradient(180deg,transparent,#2a1052 30%)}
.chatbar input{flex:1}
.back{background:none;color:var(--gold);font-size:14px;margin-bottom:10px}
.loading{text-align:center;color:var(--muted);padding:30px}
</style>
</head>
<body>

<!-- ONBOARDING -->
<div id="onboard" class="overlay hidden">
  <div class="sheet">
    <h2>Bienvenue sur KizConnect</h2>
    <p class="sub">Ton passeport pour la communauté. Choisis ton blaze.</p>
    <div class="field"><label>Pseudo</label><input id="ob-name" placeholder="Ex : Ana Kiz"></div>
    <div class="field"><label>Ville</label><input id="ob-city" placeholder="Ex : Paris"></div>
    <div class="field"><label>Style principal</label>
      <select id="ob-style">
        <option>Kizomba</option><option>Urban Kiz</option><option>Semba</option>
        <option>Afrohouse</option><option>Tarraxo</option><option>Tous</option>
      </select>
    </div>
    <button class="btn btn-gold" onclick="saveOnboard()">C'est parti</button>
  </div>
</div>

<header>
  <div class="brand">
    <span class="dot"></span>
    <div><h1>KizConnect</h1><small>La communauté danse</small></div>
  </div>
</header>

<main id="view"></main>

<button id="fab" class="fab" onclick="openCreate()">+</button>

<nav>
  <button data-tab="tickets" class="active" onclick="go('tickets')"><span class="ic">🎟️</span>Tickets</button>
  <button data-tab="carpools" onclick="go('carpools')"><span class="ic">🚗</span>Covoit</button>
  <button data-tab="training" onclick="go('training')"><span class="ic">💃</span>Training</button>
  <button data-tab="messages" onclick="go('messages')"><span class="ic">💬</span>Messages</button>
  <button data-tab="profile" onclick="go('profile')"><span class="ic">👤</span>Profil</button>
</nav>

<script>
const API="/api/app";
let ME=JSON.parse(localStorage.getItem("kc_me")||"null");
let TAB="tickets";
let CHAT_WITH=null;

const STYLES=["Kizomba","Urban Kiz","Semba","Afrohouse","Tarraxo","Tous"];
const cfg={
  tickets:{title:"Reventes de tickets",sub:"Achète ou revends ta place pour un festival.",icon:"🎟️"},
  carpools:{title:"Covoiturage",sub:"Partage la route vers les soirées et festivals.",icon:"🚗"},
  training:{title:"Training & partenaires",sub:"Trouve un partenaire pour progresser.",icon:"💃"}
};

async function api(action,payload={}){
  const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({action,...payload})});
  return r.json();
}
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function timeAgo(t){const d=(Date.now()-t)/1000;if(d<60)return"à l'instant";if(d<3600)return Math.floor(d/60)+" min";if(d<86400)return Math.floor(d/3600)+" h";return Math.floor(d/86400)+" j"}
function initials(n){return (n||"?").trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase()}

function go(tab){
  TAB=tab;CHAT_WITH=null;
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));
  document.getElementById("fab").classList.toggle("hidden",tab==="messages"||tab==="profile");
  render();
}

async function render(){
  const v=document.getElementById("view");
  if(TAB==="messages")return renderMessages();
  if(TAB==="profile")return renderProfile();
  const c=cfg[TAB];
  v.innerHTML=`<h2>${c.title}</h2><div class="sub">${c.sub}</div><div class="loading">Chargement…</div>`;
  const {items=[]}=await api("list",{type:TAB});
  let html=`<h2>${c.title}</h2><div class="sub">${c.sub}</div>`;
  if(!items.length){
    html+=`<div class="empty"><div class="big">${c.icon}</div>Rien pour le moment.<br>Sois le premier à publier avec le bouton +</div>`;
  }else{
    items.forEach(it=>html+=cardHTML(it));
  }
  v.innerHTML=html;
}

function cardHTML(it){
  const mine=ME&&it.userId===ME.userId;
  let inner="";
  if(TAB==="tickets"){
    inner=`<div class="row"><h3>${esc(it.event)}</h3><span class="price">${esc(it.price)}€</span></div>
      <div class="meta">📍 ${esc(it.city)} · 📅 ${esc(it.date||"date libre")}</div>
      ${it.note?`<div class="meta" style="margin-top:6px">${esc(it.note)}</div>`:""}
      <div><span class="tag">${esc(it.qty||1)} place(s)</span></div>`;
  }else if(TAB==="carpools"){
    inner=`<div class="row"><h3>${esc(it.from)} → ${esc(it.to)}</h3><span class="price">${it.price?esc(it.price)+"€":"gratuit"}</span></div>
      <div class="meta">📅 ${esc(it.date)} · 🕐 ${esc(it.time||"—")}</div>
      ${it.note?`<div class="meta" style="margin-top:6px">${esc(it.note)}</div>`:""}
      <div><span class="tag">${esc(it.seats||1)} place(s)</span></div>`;
  }else{
    inner=`<div class="row"><h3>${esc(it.title)}</h3></div>
      <div class="meta">📍 ${esc(it.city)} · 💃 ${esc(it.style)} · niveau ${esc(it.level||"tous")}</div>
      ${it.note?`<div class="meta" style="margin-top:6px">${esc(it.note)}</div>`:""}`;
  }
  const foot=mine
    ? `<button class="btn btn-ghost btn-sm" style="margin-top:12px" onclick="del('${it.id}')">🗑 Supprimer</button>`
    : `<button class="btn btn-ghost btn-sm" style="margin-top:12px" onclick="contact('${esc(it.userId)}','${esc(it.pseudo)}')">💬 Contacter ${esc(it.pseudo)}</button>`;
  return `<div class="card">${inner}${foot}<div class="meta" style="margin-top:8px;opacity:.6">par ${esc(it.pseudo)} · ${timeAgo(it.createdAt)}</div></div>`;
}

async function del(id){
  if(!confirm("Supprimer cette annonce ?"))return;
  await api("delete",{type:TAB,id});render();
}

/* ---- CREATE SHEET ---- */
function openCreate(){
  const forms={
    tickets:`<div class="field"><label>Festival / soirée</label><input id="f-event" placeholder="Ex : Afro Latin Fest"></div>
      <div class="field"><label>Ville</label><input id="f-city" value="${esc(ME?.city||"")}"></div>
      <div class="field"><label>Date</label><input id="f-date" placeholder="Ex : 12-14 sept."></div>
      <div class="row"><div class="field" style="flex:1"><label>Prix (€)</label><input id="f-price" type="number" inputmode="numeric"></div>
      <div class="field" style="flex:1;margin-left:10px"><label>Places</label><input id="f-qty" type="number" value="1"></div></div>
      <div class="field"><label>Note (optionnel)</label><textarea id="f-note" placeholder="Pass full week-end, cause imprévu…"></textarea></div>`,
    carpools:`<div class="row"><div class="field" style="flex:1"><label>Départ</label><input id="f-from" value="${esc(ME?.city||"")}"></div>
      <div class="field" style="flex:1;margin-left:10px"><label>Arrivée</label><input id="f-to"></div></div>
      <div class="row"><div class="field" style="flex:1"><label>Date</label><input id="f-date" placeholder="Ex : sam. 12"></div>
      <div class="field" style="flex:1;margin-left:10px"><label>Heure</label><input id="f-time" placeholder="18h"></div></div>
      <div class="row"><div class="field" style="flex:1"><label>Prix/pers (€)</label><input id="f-price" type="number"></div>
      <div class="field" style="flex:1;margin-left:10px"><label>Places libres</label><input id="f-seats" type="number" value="3"></div></div>
      <div class="field"><label>Note</label><textarea id="f-note" placeholder="Départ pile à l'heure, bagage léger…"></textarea></div>`,
    training:`<div class="field"><label>Titre</label><input id="f-title" placeholder="Ex : Cherche partenaire training urban kiz"></div>
      <div class="field"><label>Ville</label><input id="f-city" value="${esc(ME?.city||"")}"></div>
      <div class="field"><label>Style</label><select id="f-style">${STYLES.map(s=>`<option ${s===ME?.style?"selected":""}>${s}</option>`).join("")}</select></div>
      <div class="field"><label>Niveau</label><select id="f-level"><option>débutant</option><option>intermédiaire</option><option>avancé</option><option>tous</option></select></div>
      <div class="field"><label>Note</label><textarea id="f-note" placeholder="Dispo en soirée, studio ou chez moi…"></textarea></div>`
  };
  showSheet(`<h2>Publier · ${cfg[TAB].title}</h2>${forms[TAB]}<button class="btn btn-gold" onclick="submitCreate()">Publier</button>`);
}

async function submitCreate(){
  const g=id=>document.getElementById(id)?.value.trim();
  let data={};
  if(TAB==="tickets"){
    if(!g("f-event")||!g("f-price"))return alert("Festival et prix requis");
    data={event:g("f-event"),city:g("f-city"),date:g("f-date"),price:g("f-price"),qty:g("f-qty"),note:g("f-note")};
  }else if(TAB==="carpools"){
    if(!g("f-from")||!g("f-to")||!g("f-date"))return alert("Départ, arrivée et date requis");
    data={from:g("f-from"),to:g("f-to"),date:g("f-date"),time:g("f-time"),price:g("f-price"),seats:g("f-seats"),note:g("f-note")};
  }else{
    if(!g("f-title"))return alert("Titre requis");
    data={title:g("f-title"),city:g("f-city"),style:g("f-style"),level:g("f-level"),note:g("f-note")};
  }
  data.userId=ME.userId;data.pseudo=ME.name;
  await api("create",{type:TAB,data});
  closeSheet();render();
}

/* ---- MESSAGES ---- */
function contact(userId,pseudo){
  if(userId===ME.userId)return;
  CHAT_WITH={userId,pseudo};TAB="messages";
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab==="messages"));
  document.getElementById("fab").classList.add("hidden");
  openChat();
}
async function renderMessages(){
  const v=document.getElementById("view");
  if(CHAT_WITH)return openChat();
  v.innerHTML=`<h2>Messages</h2><div class="loading">Chargement…</div>`;
  const {threads=[]}=await api("listThreads",{userId:ME.userId});
  let html=`<h2>Messages</h2>`;
  if(!threads.length){html+=`<div class="empty"><div class="big">💬</div>Aucune conversation.<br>Contacte quelqu'un depuis une annonce.</div>`;}
  else{
    threads.forEach(t=>{
      html+=`<div class="thread" onclick="openChatWith('${esc(t.other)}')">
        <div class="av">${initials(t.otherName||t.other)}</div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:600">${esc(t.otherName||"Danseur")}</div>
          <div class="meta" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(t.last?.text||"")}</div>
        </div>
        <div class="meta">${t.last?timeAgo(t.last.at):""}</div>
      </div>`;
    });
  }
  v.innerHTML=html;
}
async function openChatWith(userId){
  const {profile}=await api("getProfile",{userId});
  CHAT_WITH={userId,pseudo:profile?.name||"Danseur"};
  openChat();
}
async function openChat(){
  const v=document.getElementById("view");
  v.innerHTML=`<button class="back" onclick="go('messages')">← Messages</button>
    <h2>${esc(CHAT_WITH.pseudo)}</h2><div id="chat" class="chat"><div class="loading">…</div></div>
    <div class="chatbar"><input id="msg-in" placeholder="Écris ton message…" onkeydown="if(event.key==='Enter')sendMsg()">
    <button class="btn btn-gold" style="width:auto;padding:12px 18px" onclick="sendMsg()">➤</button></div>`;
  const {messages=[]}=await api("getMessages",{userA:ME.userId,userB:CHAT_WITH.userId});
  const c=document.getElementById("chat");
  c.innerHTML=messages.length?messages.map(m=>
    `<div class="bub ${m.from===ME.userId?"me":"them"}">${esc(m.text)}</div>`).join("")
    :`<div class="empty" style="padding:20px">Dis bonjour 👋</div>`;
  c.scrollTop=c.scrollHeight;
}
async function sendMsg(){
  const inp=document.getElementById("msg-in");
  const text=inp.value.trim();if(!text)return;inp.value="";
  await api("sendMessage",{from:ME.userId,to:CHAT_WITH.userId,text,fromName:ME.name});
  openChat();
}

/* ---- PROFILE ---- */
function renderProfile(){
  const v=document.getElementById("view");
  v.innerHTML=`<h2>Mon profil</h2>
    <div class="card" style="text-align:center;padding:22px">
      <div class="av" style="width:70px;height:70px;font-size:24px;margin:0 auto 12px">${initials(ME.name)}</div>
      <h3 style="font-size:18px">${esc(ME.name)}</h3>
      <div class="meta">📍 ${esc(ME.city)} · 💃 ${esc(ME.style)}</div>
    </div>
    <div class="field"><label>Pseudo</label><input id="p-name" value="${esc(ME.name)}"></div>
    <div class="field"><label>Ville</label><input id="p-city" value="${esc(ME.city)}"></div>
    <div class="field"><label>Style</label><select id="p-style">${STYLES.map(s=>`<option ${s===ME.style?"selected":""}>${s}</option>`).join("")}</select></div>
    <button class="btn btn-gold" onclick="saveProfile()">Enregistrer</button>
    <button class="btn btn-ghost" style="width:100%;margin-top:10px" onclick="logout()">Se déconnecter</button>`;
}
async function saveProfile(){
  ME.name=document.getElementById("p-name").value.trim()||ME.name;
  ME.city=document.getElementById("p-city").value.trim();
  ME.style=document.getElementById("p-style").value;
  localStorage.setItem("kc_me",JSON.stringify(ME));
  await api("saveProfile",{profile:ME});
  alert("Profil enregistré ✅");renderProfile();
}
function logout(){localStorage.removeItem("kc_me");location.reload();}

/* ---- SHEETS ---- */
function showSheet(html){
  const o=document.createElement("div");o.className="overlay";o.id="sheet-o";
  o.innerHTML=`<div class="sheet">${html}</div>`;
  o.onclick=e=>{if(e.target===o)closeSheet();};
  document.body.appendChild(o);
}
function closeSheet(){document.getElementById("sheet-o")?.remove();}

/* ---- ONBOARD ---- */
async function saveOnboard(){
  const name=document.getElementById("ob-name").value.trim();
  if(!name)return alert("Choisis un pseudo");
  ME={userId:Date.now().toString(36)+Math.random().toString(36).slice(2,7),
    name,city:document.getElementById("ob-city").value.trim(),
    style:document.getElementById("ob-style").value};
  localStorage.setItem("kc_me",JSON.stringify(ME));
  await api("saveProfile",{profile:ME});
  document.getElementById("onboard").classList.add("hidden");
  render();
}

/* ---- BOOT ---- */
if(!ME){document.getElementById("onboard").classList.remove("hidden");}
else{render();}
if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});
</script>
</body>
</html>
